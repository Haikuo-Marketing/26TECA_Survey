<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c29">
  <title>海國樂器｜2026 台北國際音響展問卷</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: radial-gradient(circle at 50% 0, #22445c, #101c29 60%); color: #f6fafc; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); background: #192e40; border: 1px solid #39546a; border-radius: 20px; padding: 34px 24px; text-align: center; box-shadow: 0 18px 50px #0004; }
    .brand { color: #8fe0d7; font-size: .75rem; letter-spacing: .2em; font-weight: 700; }
    h1 { font-size: 1.5rem; line-height: 1.5; margin: 18px 0 10px; }
    p { line-height: 1.75; color: #d2e1ec; }
    .spinner { width: 34px; height: 34px; border: 3px solid #49677c; border-top-color: #8fe0d7; border-radius: 50%; margin: 28px auto 16px; animation: spin .85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button { display: none; width: 100%; background: #8fe0d7; color: #112530; font-weight: 700; font-size: 1rem; border: 0; border-radius: 10px; padding: 14px; cursor: pointer; margin-top: 18px; }
    small { display: block; color: #aac0ce; font-size: .78rem; margin-top: 20px; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <div class="brand">HAIGUO MUSIC</div>
    <h1>2026 台北國際音響展<br>LINE 好友問卷</h1>
    <p id="status" role="status">正在取得您的 LINE 身分資訊，隨後將開啟問卷…</p>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <button id="retry" type="button">重新嘗試</button>
    <small>LINE UID 僅用於識別問卷回覆與整理好友標籤。<br>本頁不會顯示或儲存您的 LINE UID。</small>
  </main>
<script>
  // 請為「音響展」建立獨立 LIFF App，將這個值換成新的 LIFF ID。
  // LINE Developers 中的 Endpoint URL 設為 GitHub Pages 網址。
  const LIFF_ID = '請填入音響展的_LIFF_ID';
  const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdKhj6l_Gn0A549kRz8SOLnR8Qqtt5icyPG1IgQTkXbx8-ezQ/viewform';
  const UID_ENTRY = 'entry.96961763';

  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  const spinner = document.getElementById('spinner');

  function errorState(message) {
    status.textContent = message;
    spinner.style.display = 'none';
    retry.style.display = 'block';
  }

  async function start() {
    retry.style.display = 'none';
    spinner.style.display = 'block';
    status.textContent = '正在取得您的 LINE 身分資訊，隨後將開啟問卷…';
    try {
      if (!LIFF_ID || LIFF_ID.includes('請填入')) {
        throw new Error('尚未設定音響展 LIFF ID。請先在 index.html 中填入。');
      }
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: window.location.href });
        return;
      }
      const profile = await liff.getProfile();
      const uid = profile && profile.userId;
      if (!/^U[0-9a-f]{32}$/i.test(uid || '')) {
        throw new Error('未能取得有效的 LINE UID，請重新登入後嘗試。');
      }
      const url = new URL(FORM_URL);
      url.searchParams.set('usp', 'pp_url');
      url.searchParams.set(UID_ENTRY, uid);
      status.textContent = '驗證成功，正在開啟 Google 問卷…';
      window.location.replace(url.toString());
    } catch (err) {
      console.error('LIFF questionnaire error', err);
      errorState(err && err.message ? err.message : '連線失敗，請重新嘗試。');
    }
  }
  retry.addEventListener('click', start);
  start();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132638">
  <title>問卷完成｜海國樂器 2026 台北國際音響展</title>
  <style>
    :root {font-family: -apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; color-scheme: dark;}
    * {box-sizing:border-box}
    body {margin:0; min-height:100svh; display:grid; place-items:center; padding:24px 18px; color:#f7fbfd; background:radial-gradient(circle at 50% 0%,#24485d,#122233 68%)}
    main {width:min(100%,440px); background:#1a3042; border:1px solid #3c5970; border-radius:23px; padding:36px 24px 26px; text-align:center; box-shadow:0 18px 60px #0005}
    .brand {color:#8de0d6; font-size:12px; letter-spacing:.22em; font-weight:800}
    .check {display:grid; place-items:center; width:74px; height:74px; border-radius:50%; margin:25px auto 18px; background:#244d53; color:#9aeee2; font-size:41px; font-weight:700}
    h1 {font-size:27px; margin:8px 0 12px; line-height:1.45}
    p {color:#d7e5ee; line-height:1.85; margin:10px 0}
    .gift {font-size:38px; margin:25px 0 8px}
    .cta {display:block; width:100%; text-decoration:none; border:0; border-radius:13px; padding:16px 12px; margin:23px 0 12px; background:#8de0d6; color:#102a34; font-size:17px; font-weight:800; cursor:pointer}
    .cta[hidden] {display:none}
    .sub {display:block; text-decoration:none; color:#c3eae7; padding:10px; font-size:14px}
    .notice {padding:13px; background:#213a4e; border-radius:10px; color:#bfd0dc; font-size:12px; line-height:1.75; text-align:left; margin-top:18px}
    .warn {color:#ffd9a2}
  </style>
</head>
<body>
  <main>
    <div class="brand">HAIGUO MUSIC</div>
    <div class="check" aria-hidden="true">✓</div>
    <h1>恭喜完成問卷！</h1>
    <p>感謝參加 2026 台北國際音響展<br>海國 LINE 好友問卷。</p>
    <div class="gift" aria-hidden="true">🎁</div>
    <p><strong>請返回海國 LINE 官方帳號<br>領取現場限定小禮物！</strong></p>
    <a id="claim" class="cta" href="#" hidden>返回 LINE 領取小禮物</a>
    <p id="setup-note" class="warn" hidden>領獎連結尚未設定，請先聯繫海國現場工作人員。</p>
    <a id="back" class="sub" href="#" hidden>返回海國 LINE 官方帳號</a>
    <div class="notice">※ 本頁為問卷完成後的導引畫面；僅開啟此頁不代表已驗證填答資格。請依漸強獎項管理的資格與現場核銷規則領取，每人限領一次，數量有限，送完為止。</div>
  </main>
<script>
  // === 部署前設定 ===
  // 優先填入「漸強獎項管理」實際產生的領獎連結。
  // 注意：要在漸強端驗證完成問卷的 UID 或兌換資格，不能只憑點連結發獎。
  const MAAC_CLAIM_URL = '';

  // 備用：海國 LINE 官方帳號聊天室連結，例如 https://lin.ee/xxxxxxxx
  const LINE_OA_URL = '';
  // ==================

  const claim = document.getElementById('claim');
  const back = document.getElementById('back');
  const note = document.getElementById('setup-note');

  function safeHttps(url) {
    try { const u = new URL(url); return u.protocol === 'https:' ? u.toString() : ''; }
    catch(e) { return ''; }
  }

  const maac = safeHttps(MAAC_CLAIM_URL);
  const oa = safeHttps(LINE_OA_URL);
  if (maac) {
    claim.href = maac;
    claim.hidden = false;
    claim.textContent = '領取小禮物';
  } else if (oa) {
    claim.href = oa;
    claim.hidden = false;
    claim.textContent = '返回 LINE 領取小禮物';
  } else {
    note.hidden = false;
  }
  if (oa && oa !== maac) {
    back.href = oa;
    back.hidden = false;
  }
</script>
</body>
</html>
